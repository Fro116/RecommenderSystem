server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /title {
        try_files /title.html =404;
    }

    # search.html only exists when VITE_ENABLE_SEARCH_BY_QUERY is on;
    # otherwise fall back to the app, which shows its not-found page.
    location = /search {
        try_files /search.html /app.html;
    }

    location = /about {
        try_files /about.html =404;
    }

    location / {
        try_files $uri /app.html;
    }
}
